[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "factset-earnings-momentum-dashboard"
version = "0.1.0"
description = "Local research dashboard for FactSet S&P 500 earnings momentum"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.0",
  "plotly>=5.0",
  "streamlit>=1.61",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "PyYAML>=6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
